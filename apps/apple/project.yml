name: QingxuApple
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    revision: ae8562f895de06ccb86fdb1cbb65fd99c8976e12
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    revision: 7691f85b222a67a66b58499e1b2647443cf0dda7
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  SwiftNIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "117"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  QingxuiOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
      - path: ../flutter/ios/Shared/QingxuPomodoroAttributes.swift
      - path: ../flutter/ios/Runner/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: QingxuWidgets
        embed: true
      - package: Citadel
        product: Citadel
      - package: SwiftTerm
        product: SwiftTerm
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIOSSH
        product: NIOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.darker.qingxu
        PRODUCT_NAME: Qingxu
        INFOPLIST_KEY_CFBundleDisplayName: 清序
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Configuration/QingxuiOS.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "$(IOS_DEVELOPMENT_TEAM)"
        PROVISIONING_PROFILE_SPECIFIER: "$(IOS_MAIN_PROFILE_SPECIFIER)"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated/QingxuiOS-Info.plist
      properties:
        CFBundleDisplayName: 清序
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: QingxuLaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: one.darker.qingxu
            CFBundleURLSchemes: [qingxu]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        BGTaskSchedulerPermittedIdentifiers:
          - one.darker.qingxu.rss.refresh
        UIBackgroundModes:
          - fetch
  QingxuWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ../flutter/ios/QingxuWidgets/QingxuWidgets.swift
      - path: ../flutter/ios/Shared/QingxuPomodoroAttributes.swift
      - path: Shared/QingxuRemoteSessionAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.darker.qingxu.widgets
        PRODUCT_NAME: QingxuWidgets
        CODE_SIGN_ENTITLEMENTS: Configuration/QingxuWidgets.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "$(IOS_DEVELOPMENT_TEAM)"
        PROVISIONING_PROFILE_SPECIFIER: "$(IOS_WIDGET_PROFILE_SPECIFIER)"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Configuration/QingxuWidgets-Info.plist
      properties:
        CFBundleDisplayName: 清序小组件
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
  QingxumacOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
      - path: ../flutter/macos/Runner/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: QingxumacOSWidgets
        embed: true
      - package: Citadel
        product: Citadel
      - package: SwiftTerm
        product: SwiftTerm
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIOSSH
        product: NIOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.darker.qingxu
        PRODUCT_NAME: Qingxu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Configuration/QingxumacOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Generated/QingxumacOS-Info.plist
      properties:
        CFBundleDisplayName: 清序
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: one.darker.qingxu
            CFBundleURLSchemes: [qingxu]
  QingxumacOSWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: macOSWidgets
      - path: Shared/QingxuRemoteSessionAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.darker.qingxu.macos.widgets
        PRODUCT_NAME: QingxumacOSWidgets
        CODE_SIGN_ENTITLEMENTS: Configuration/QingxumacOSWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/QingxumacOSWidgets-Info.plist
      properties:
        CFBundleDisplayName: 清序桌面小组件
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
