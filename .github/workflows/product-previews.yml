name: Product Previews

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]

permissions:
  contents: write

env:
  PREVIEW_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: qingxu-product-previews
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIEW_REF }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Record latest stable Android toolchain
        run: |
          flutter --version
          java -version
      - name: Build preview APK
        working-directory: apps/flutter
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Capture Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          heap-size: 768M
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p preview
            apk="apps/flutter/build/app/outputs/flutter-apk/app-debug.apk"
            package="one.darker.qingxu"

            adb wait-for-device
            for attempt in $(seq 1 60); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] \
                && adb shell pm path android >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "Android package service did not become ready." >&2
                exit 1
              fi
              sleep 3
            done

            adb shell cmd uimode night yes
            adb shell settings put system font_scale 1.0

            installed=false
            for attempt in 1 2 3; do
              if adb install --no-streaming -r -t "$apk"; then
                installed=true
                break
              fi
              echo "APK install attempt $attempt failed; reconnecting ADB." >&2
              adb kill-server || true
              adb start-server
              adb wait-for-device
              sleep $((attempt * 5))
            done
            test "$installed" = true
            adb shell pm path "$package" >/dev/null

            adb shell am force-stop "$package"
            adb shell monkey -p "$package" -c android.intent.category.LAUNCHER 1
            sleep 16
            adb exec-out screencap -p > preview/android.png
            printf '%s\n' "$PREVIEW_REF" > preview/android.sha
      - uses: actions/upload-artifact@v7
        with:
          name: preview-android
          path: preview/android.*
          if-no-files-found: error

  ios:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIEW_REF }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Record latest stable Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Prepare Xcode project
        working-directory: apps/apple
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build and capture iOS Simulator
        working-directory: apps/apple
        run: |
          set -euo pipefail
          mkdir -p ../../preview
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for values in data["devices"].values() for d in values if d.get("isAvailable") and d["name"].startswith("iPhone")]; preferred=next((d for d in devices if "16 Pro" in d["name"]), devices[0]); print(preferred["udid"])')"
          xcrun simctl boot "$udid" || true
          open -a Simulator
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 92 --wifiBars 3 --cellularBars 4
          xcodebuild \
            -project QingxuApple.xcodeproj \
            -scheme QingxuiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$udid" \
            -derivedDataPath .preview-ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          app="$(find .preview-ios/Build/Products -path '*iphonesimulator/Qingxu.app' -print -quit)"
          test -n "$app"
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" one.darker.qingxu
          sleep 8
          xcrun simctl openurl "$udid" qingxu://today
          sleep 4
          xcrun simctl io "$udid" screenshot ../../preview/ios.png
          printf '%s\n' "$PREVIEW_REF" > ../../preview/ios.sha
      - uses: actions/upload-artifact@v7
        with:
          name: preview-ios
          path: preview/ios.*
          if-no-files-found: error

  macos:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIEW_REF }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Record latest stable Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
      - name: Build and capture macOS app
        working-directory: apps/apple
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild \
            -project QingxuApple.xcodeproj \
            -scheme QingxumacOS \
            -configuration Debug \
            -derivedDataPath .preview-macos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          app="$(find .preview-macos/Build/Products -path '*/Qingxu.app' -print -quit)"
          test -n "$app"
          "$app/Contents/MacOS/Qingxu" > /tmp/qingxu-preview.log 2>&1 &
          sleep 10
          osascript -e 'tell application "System Events" to tell process "Qingxu" to set frontmost to true' || true
          osascript -e 'tell application "System Events" to tell process "Qingxu" to set size of front window to {1280, 800}' || true
          osascript -e 'tell application "System Events" to tell process "Qingxu" to set position of front window to {120, 90}' || true
          sleep 3
          mkdir -p ../../preview
          /usr/sbin/screencapture -x ../../preview/macos.png
          printf '%s\n' "$PREVIEW_REF" > ../../preview/macos.sha
      - uses: actions/upload-artifact@v7
        with:
          name: preview-macos
          path: preview/macos.*
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIEW_REF }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Record latest stable Windows toolchain
        shell: pwsh
        run: |
          flutter --version
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
      - name: Build current Windows preview
        working-directory: apps/flutter
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
      - name: Capture expanded Windows overlay
        shell: pwsh
        run: |
          $env:QINGXU_PREVIEW_EXPANDED = '1'
          $exe = Get-ChildItem -LiteralPath apps\flutter\build\windows -Recurse -Filter 'Qingxu.exe' | Select-Object -First 1
          if ($null -eq $exe) { throw 'Qingxu.exe was not found.' }
          & .\scripts\previews\capture_windows.ps1 -Executable $exe.FullName -Output "$PWD\preview\windows.png"
          Set-Content -LiteralPath "$PWD\preview\windows.sha" -Value $env:PREVIEW_REF -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7
        with:
          name: preview-windows
          path: preview/windows.*
          if-no-files-found: error

  publish:
    needs: [android, ios, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIEW_REF }}
      - uses: actions/download-artifact@v8
        with:
          pattern: preview-*
          path: captured
          merge-multiple: true
      - name: Compose high-resolution previews
        run: |
          set -euo pipefail
          test "$(sort -u captured/*.sha | wc -l)" -eq 1
          test "$(head -n 1 captured/ios.sha)" = "$PREVIEW_REF"
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/previews/compose_product_previews.py \
            --ios captured/ios.png \
            --android captured/android.png \
            --macos captured/macos.png \
            --windows captured/windows.png \
            --output-dir product-previews
      - uses: actions/upload-artifact@v7
        with:
          name: qingxu-product-previews
          path: product-previews/*.png
          if-no-files-found: error
      - name: Replace preview assets in the latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --json tagName --jq .tagName)"
          gh release upload "$tag" product-previews/*.png --clobber
