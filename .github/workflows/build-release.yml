name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qingxu-${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve build version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          current="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' apps/flutter/pubspec.yaml)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Flutter version in apps/flutter/pubspec.yaml: $current" >&2
            exit 1
          fi

          should_release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            should_release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            existing_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [[ -n "$existing_tag" ]]; then
              version="${existing_tag#v}"
            else
              latest_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
              base="$current"
              if [[ -n "$latest_tag" ]]; then
                latest="${latest_tag#v}"
                base="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)"
              fi
              IFS=. read -r major minor patch <<< "$base"
              version="$major.$minor.$((patch + 1))"
            fi
            should_release=true
          else
            version="$current"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use x.y.z format: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "Building Qingxu v$version ($GITHUB_RUN_NUMBER)"

  flutter-web:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER"
      - name: Package Web
        run: cd build/web && zip -r "../../../../Qingxu-${APP_VERSION}-Web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: qingxu-${{ needs.version.outputs.version }}-web
          retention-days: 7
          path: Qingxu-${{ needs.version.outputs.version }}-Web.zip

  flutter-windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/flutter
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-name "$env:APP_VERSION" --build-number "$env:BUILD_NUMBER"
      - name: Add VC runtime and package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = (Resolve-Path "build\windows\x64\runner\Release").Path
          $runtime = $null

          if ($env:VCToolsRedistDir) {
            $candidate = Join-Path $env:VCToolsRedistDir "x64\Microsoft.VC143.CRT"
            if (Test-Path $candidate) { $runtime = $candidate }
          }

          if (-not $runtime) {
            $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsInstall = & $vswhere -latest -products * -property installationPath
              if ($vsInstall) {
                $redistRoot = Join-Path $vsInstall "VC\Redist\MSVC"
                if (Test-Path $redistRoot) {
                  $runtime = Get-ChildItem $redistRoot -Directory |
                    Sort-Object Name -Descending |
                    ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" } |
                    Where-Object { Test-Path $_ } |
                    Select-Object -First 1
                }
              }
            }
          }

          if ($runtime) {
            Write-Host "Bundling VC++ runtime from $runtime"
            Copy-Item "$runtime\*.dll" $release -Force
          }

          $required = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          foreach ($dll in $required) {
            $destination = Join-Path $release $dll
            if (-not (Test-Path $destination)) {
              $fallback = Join-Path "$env:SystemRoot\System32" $dll
              if (Test-Path $fallback) {
                Copy-Item $fallback $destination -Force
              }
            }
            if (-not (Test-Path $destination)) {
              throw "Required VC++ runtime DLL is missing: $dll"
            }
          }

          Get-Item ($required | ForEach-Object { Join-Path $release $_ }) |
            Select-Object Name, Length, VersionInfo
          $portable = "..\..\Qingxu-$($env:APP_VERSION)-Windows-Portable.zip"
          Compress-Archive -Path "$release\*" -DestinationPath $portable
      - name: Build installer EXE
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" scripts\windows\Qingxu.iss
      - uses: actions/upload-artifact@v4
        with:
          name: qingxu-${{ needs.version.outputs.version }}-windows
          retention-days: 7
          path: |
            Qingxu-${{ needs.version.outputs.version }}-Windows-Portable.zip
            artifacts/Qingxu-${{ needs.version.outputs.version }}-Windows-Setup.exe

  flutter-ios:
    needs: version
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/flutter
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show selected Xcode
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER"
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/Qingxu.app
          cd build/ipa && zip -r "../../Qingxu-${APP_VERSION}-iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: qingxu-${{ needs.version.outputs.version }}-ios
          retention-days: 7
          path: apps/flutter/Qingxu-${{ needs.version.outputs.version }}-iOS-unsigned.ipa

  github-release:
    if: needs.version.outputs.should_release == 'true'
    needs: [version, flutter-web, flutter-windows, flutter-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "清序 $RELEASE_TAG"
          fi
      - name: Persist version in source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B version-bump origin/main

          remote_version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' apps/flutter/pubspec.yaml)"
          newest="$(printf '%s\n%s\n' "$remote_version" "$APP_VERSION" | sort -V | tail -n 1)"
          if [[ "$newest" != "$APP_VERSION" ]]; then
            echo "Source already contains newer version $remote_version; skipping v$APP_VERSION write-back."
            exit 0
          fi

          sed -i -E "s/^version:.*/version: ${APP_VERSION}+${BUILD_NUMBER}/" apps/flutter/pubspec.yaml
          sed -i -E "s/^#define MyAppVersion .*/#define MyAppVersion \"${APP_VERSION}\"/" scripts/windows/Qingxu.iss

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/pubspec.yaml scripts/windows/Qingxu.iss
          if git diff --cached --quiet; then
            echo "Version metadata is already current."
          else
            git commit -m "chore: bump version to $RELEASE_TAG [skip ci]"
            git push origin HEAD:main
          fi
