name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qingxu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve build version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          current="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' apps/flutter/pubspec.yaml)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Flutter version in apps/flutter/pubspec.yaml: $current" >&2
            exit 1
          fi

          should_release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            should_release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            existing_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [[ -n "$existing_tag" ]]; then
              version="${existing_tag#v}"
            else
              latest_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
              base="$current"
              if [[ -n "$latest_tag" ]]; then
                latest="${latest_tag#v}"
                base="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)"
              fi
              IFS=. read -r major minor patch <<< "$base"
              version="$major.$minor.$((patch + 1))"
            fi
            should_release=true
          else
            version="$current"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use x.y.z format: $version" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "build_number=$GITHUB_RUN_NUMBER"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"
          echo "Building Qingxu v$version ($GITHUB_RUN_NUMBER)"

  flutter-checks:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  sync-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sync
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/sync/go.mod
          cache-dependency-path: services/sync/go.mod
      - name: Test sync service
        run: go test ./...
      - name: Vet sync service
        run: go vet ./...
      - name: Build sync container
        run: docker build --tag qingxu-sync:test .

  docker-publish:
    if: needs.version.outputs.should_release == 'true'
    needs: [version, sync-server, flutter-checks, flutter-windows, apple-ios, flutter-android, apple-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: services/sync
          push: true
          tags: |
            ghcr.io/felixzoe/qingxu-sync:${{ needs.version.outputs.version }}
            ghcr.io/felixzoe/qingxu-sync:latest
          labels: |
            org.opencontainers.image.title=qingxu-sync
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  flutter-windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/flutter
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-name "$env:APP_VERSION" --build-number "$env:BUILD_NUMBER"
      - name: Add VC runtime and package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = (Resolve-Path "build\windows\x64\runner\Release").Path
          $runtime = $null

          if ($env:VCToolsRedistDir) {
            $candidate = Join-Path $env:VCToolsRedistDir "x64\Microsoft.VC143.CRT"
            if (Test-Path $candidate) { $runtime = $candidate }
          }

          if (-not $runtime) {
            $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsInstall = & $vswhere -latest -products * -property installationPath
              if ($vsInstall) {
                $redistRoot = Join-Path $vsInstall "VC\Redist\MSVC"
                if (Test-Path $redistRoot) {
                  $runtime = Get-ChildItem $redistRoot -Directory |
                    Sort-Object Name -Descending |
                    ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" } |
                    Where-Object { Test-Path $_ } |
                    Select-Object -First 1
                }
              }
            }
          }

          if ($runtime) {
            Write-Host "Bundling VC++ runtime from $runtime"
            Copy-Item "$runtime\*.dll" $release -Force
          }

          $required = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          foreach ($dll in $required) {
            $destination = Join-Path $release $dll
            if (-not (Test-Path $destination)) {
              $fallback = Join-Path "$env:SystemRoot\System32" $dll
              if (Test-Path $fallback) {
                Copy-Item $fallback $destination -Force
              }
            }
            if (-not (Test-Path $destination)) {
              throw "Required VC++ runtime DLL is missing: $dll"
            }
          }

          Get-Item ($required | ForEach-Object { Join-Path $release $_ }) |
            Select-Object Name, Length, VersionInfo

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE)) {
            $certificate = Join-Path $env:RUNNER_TEMP "qingxu-signing.pfx"
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
            )
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw "signtool.exe was not found" }
            & $signTool.FullName sign /fd SHA256 /f $certificate `
              /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com `
              /td SHA256 "$release\Qingxu.exe"
            if ($LASTEXITCODE -ne 0) { throw "Signing Qingxu.exe failed" }
            Remove-Item -LiteralPath $certificate -Force
          } else {
            Write-Host "No trusted signing certificate configured; publishing an unsigned beta build."
          }

          $portable = "..\..\Qingxu-$($env:APP_VERSION)-Windows-Portable.zip"
          Compress-Archive -Path "$release\*" -DestinationPath $portable
      - name: Build installer EXE
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" scripts\windows\Qingxu.iss
      - name: Sign installer when a trusted certificate is configured
        if: env.WINDOWS_SIGNING_CERTIFICATE != ''
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $certificate = Join-Path $env:RUNNER_TEMP "qingxu-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
          )
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found" }
          $installer = "artifacts\Qingxu-$($env:APP_VERSION)-Windows-Setup.exe"
          & $signTool.FullName sign /fd SHA256 /f $certificate `
            /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com `
            /td SHA256 $installer
          if ($LASTEXITCODE -ne 0) { throw "Signing the installer failed" }
          & $signTool.FullName verify /pa /v $installer
          if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed" }
          Remove-Item -LiteralPath $certificate -Force
      - uses: actions/upload-artifact@v7
        with:
          name: qingxu-${{ needs.version.outputs.version }}-windows
          retention-days: 7
          path: |
            Qingxu-${{ needs.version.outputs.version }}-Windows-Portable.zip
            artifacts/Qingxu-${{ needs.version.outputs.version }}-Windows-Setup.exe

  apple-ios:
    needs: version
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/apple
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version
      - name: Generate native Apple project
        run: xcodegen generate
      - name: Build unsigned native iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project QingxuApple.xcodeproj \
            -scheme QingxuiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Qingxu.app build/ipa/Payload/Qingxu.app
          cd build/ipa && zip -r "../../Qingxu-${APP_VERSION}-iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: qingxu-${{ needs.version.outputs.version }}-ios
          retention-days: 7
          path: apps/apple/Qingxu-${{ needs.version.outputs.version }}-iOS-unsigned.ipa

  flutter-android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER"
      - name: Package Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "Qingxu-${APP_VERSION}-Android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: qingxu-${{ needs.version.outputs.version }}-android
          retention-days: 7
          path: apps/flutter/Qingxu-${{ needs.version.outputs.version }}-Android.apk

  apple-macos:
    needs: version
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/apple
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version
      - name: Generate native Apple project
        run: xcodegen generate
      - name: Build native macOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project QingxuApple.xcodeproj \
            -scheme QingxumacOS \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
      - name: Package macOS app
        run: |
          set -euo pipefail
          app_path="$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --keepParent "$app_path" "Qingxu-${APP_VERSION}-macOS-Portable.zip"
          hdiutil create -volname "清序" -srcfolder "$app_path" -ov -format UDZO "Qingxu-${APP_VERSION}-macOS.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: qingxu-${{ needs.version.outputs.version }}-macos
          retention-days: 7
          path: |
            apps/apple/Qingxu-${{ needs.version.outputs.version }}-macOS-Portable.zip
            apps/apple/Qingxu-${{ needs.version.outputs.version }}-macOS.dmg

  github-release:
    if: >-
      always() &&
      needs.version.outputs.should_release == 'true' &&
      needs.flutter-checks.result == 'success' &&
      needs.flutter-windows.result == 'success' &&
      needs.apple-ios.result == 'success' &&
      needs.flutter-android.result == 'success' &&
      needs.apple-macos.result == 'success' &&
      needs.sync-server.result == 'success' &&
      needs.docker-publish.result == 'success'
    needs: [version, flutter-checks, flutter-windows, apple-ios, flutter-android, apple-macos, sync-server, docker-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: qingxu-${{ needs.version.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          checksum_file="$(mktemp)"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > "$checksum_file"
          mv "$checksum_file" SHA256SUMS.txt
      - name: Attest release build provenance
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' release_files < <(find release-assets -type f -print0)
          if (( ${#release_files[@]} == 0 )); then
            echo "No release files were downloaded." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${release_files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "清序 $RELEASE_TAG"
          fi
  version-writeback:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Persist released version in source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "main moved to $remote_sha; leaving version write-back to the newer workflow."
            exit 0
          fi
          git checkout --detach "$GITHUB_SHA"

          remote_version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' apps/flutter/pubspec.yaml)"
          newest="$(printf '%s\n%s\n' "$remote_version" "$APP_VERSION" | sort -V | tail -n 1)"
          if [[ "$newest" != "$APP_VERSION" ]]; then
            echo "Source contains newer version $remote_version; skipping v$APP_VERSION write-back."
            exit 0
          fi

          sed -i -E "s/^version:.*/version: ${APP_VERSION}+${BUILD_NUMBER}/" apps/flutter/pubspec.yaml
          sed -i -E "s/^([[:space:]]*)MARKETING_VERSION:.*/\1MARKETING_VERSION: \"${APP_VERSION}\"/" apps/apple/project.yml
          sed -i -E "s/^([[:space:]]*)CURRENT_PROJECT_VERSION:.*/\1CURRENT_PROJECT_VERSION: \"${BUILD_NUMBER}\"/" apps/apple/project.yml
          sed -i -E "s/^#define MyAppVersion .*/#define MyAppVersion \"${APP_VERSION}\"/" scripts/windows/Qingxu.iss

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/pubspec.yaml apps/apple/project.yml scripts/windows/Qingxu.iss
          if git diff --cached --quiet; then
            echo "Version metadata is already current."
          else
            git commit -m "chore: bump version to $RELEASE_TAG [skip ci]"
            git push origin HEAD:main
          fi
