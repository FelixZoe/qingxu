name: qingxu

services:
  sync:
    build:
      context: ../services/sync
    image: qingxu-sync:${QINGXU_VERSION:-local}
    restart: unless-stopped
    environment:
      SYNC_TOKEN: ${SYNC_TOKEN:?请在 .env 中设置 64 位十六进制 SYNC_TOKEN}
      SYNC_CORS_ORIGINS: ${SYNC_CORS_ORIGINS:-https://todo.darker.one}
      SYNC_MAX_BODY_BYTES: ${SYNC_MAX_BODY_BYTES:-2097152}
      GOMEMLIMIT: ${GOMEMLIMIT:-48MiB}
    expose:
      - "8080"
    volumes:
      - qingxu-sync-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "/qingxu-sync", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    stop_grace_period: 15s

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        APP_VERSION: ${QINGXU_VERSION:-0.1.0}
    image: qingxu-web:${QINGXU_VERSION:-local}
    restart: unless-stopped
    depends_on:
      sync:
        condition: service_healthy
    ports:
      - "${QINGXU_LISTEN:-127.0.0.1:8090}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m,mode=0755
      - /var/run:size=1m,mode=0755
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  qingxu-sync-data:
